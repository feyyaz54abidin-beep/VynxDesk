name: Verify and apply VynxDesk hardening

on:
  push:
    branches: [codex/vynxdesk-hardening-20260926]
    paths:
      - '.github/maintenance/hardening.*'
      - '.github/workflows/vynxdesk-apply-hardening.yml'

permissions:
  contents: write

jobs:
  verify-apply:
    if: github.repository == 'feyyaz54abidin-beep/VynxDesk' && github.ref == 'refs/heads/codex/vynxdesk-hardening-20260926'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact patch and prepare baseline regressions
        shell: python {0}
        run: |
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'ca66b3ad2ecada8b69968a07100f12de99fc9807', 'HEAD'], check=True)
          encoded = ''.join(Path(f'.github/maintenance/hardening.{index}').read_text() for index in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'bd771eb9227599ae7955a71542a66094bf866de82bc7e1d769382e6569c1f332'
          output = Path(os.environ['RUNNER_TEMP']) / 'vynxdesk-hardening.patch'
          output.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', str(output)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--include=scripts/tests/windows/distribution.ps1', '--include=scripts/tests/windows/input_probe.py', str(output)], check=True)
      - name: Prove native regressions fail before fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python scripts/tests/windows/input_probe.py *> "$env:RUNNER_TEMP/red-input.log"
          $inputExit = $LASTEXITCODE
          powershell.exe -NoProfile -NonInteractive -File scripts/tests/windows/distribution.ps1 *> "$env:RUNNER_TEMP/red-distribution.log"
          $distributionExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content "$env:RUNNER_TEMP/red-input.log"
          Get-Content "$env:RUNNER_TEMP/red-distribution.log"
          if ($inputExit -eq 0 -or $distributionExit -eq 0) { throw 'Expected baseline regressions did not fail' }
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP/red-input.log" -SimpleMatch 'test result: FAILED')) { throw 'Native probe did not reach its assertions' }
          if (-not (Select-String -LiteralPath "$env:RUNNER_TEMP/red-distribution.log" -SimpleMatch 'Distribution tests:')) { throw 'Distribution fixtures did not execute' }
          exit 0
      - name: Apply focused changes and remove temporary delivery files
        shell: pwsh
        run: |
          git clean -fd -- scripts/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --unidiff-zero --check "$env:RUNNER_TEMP/vynxdesk-hardening.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --unidiff-zero "$env:RUNNER_TEMP/vynxdesk-hardening.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm .github/maintenance/hardening.0 .github/maintenance/hardening.1 .github/maintenance/hardening.2 .github/maintenance/hardening.3 .github/workflows/vynxdesk-apply-hardening.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden Windows input, source export and release packaging'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/VYNXDESK_COMMIT.txt"
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.2
      - name: Python regression suite
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows input regressions after fixes
        run: python scripts/tests/windows/input_probe.py
      - name: Windows PowerShell 5.1 distribution regressions
        shell: powershell
        run: ./scripts/tests/windows/distribution.ps1
      - name: PowerShell 7 distribution regressions
        shell: pwsh
        run: ./scripts/tests/windows/distribution.ps1
      - name: Validate contracts and exact source export
        shell: pwsh
        run: |
          python scripts/check_build_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_release_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package_source.py --output "$env:RUNNER_TEMP/vynxdesk-hardened-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Push only the verified isolated feature branch
        run: git push origin HEAD:refs/heads/codex/vynxdesk-hardening-20260926
      - name: Preserve regression evidence and source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vynxdesk-hardening-evidence
          path: |
            ${{ runner.temp }}/red-input.log
            ${{ runner.temp }}/red-distribution.log
            ${{ runner.temp }}/VYNXDESK_COMMIT.txt
            ${{ runner.temp }}/vynxdesk-hardened-source.zip
          retention-days: 7
