name: Verify VynxDesk Android and managed-service changes

on:
  push:
    branches: [codex/vynxdesk-android-licensing-20260926]
    paths:
      - '.github/maintenance/android-license.*'
      - '.github/workflows/vynxdesk-apply-android.yml'

permissions:
  contents: write
  actions: read

jobs:
  verify-candidate:
    if: github.repository == 'feyyaz54abidin-beep/VynxDesk' && github.ref == 'refs/heads/codex/vynxdesk-android-licensing-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact reviewed patches and apply in isolated runner
        shell: python {0}
        run: |
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          subprocess.run(['git', 'merge-base', '--is-ancestor', '64c292c78f5ae3cd0ee37b23ab318fb0d2f17096', 'HEAD'], check=True)
          data = ''.join(Path(f'.github/maintenance/android-license.{i}').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '60d72f9c38231cb377636f11101efc323fea239cefa7c82f5fce7aab0c354d7d'
          path = Path(os.environ['RUNNER_TEMP']) / 'android-managed.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          followup = Path('.github/maintenance/android-license.followup.patch').read_bytes().replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(followup).hexdigest() == 'f5b6bbbc7f6e2a04fc8ba2ead80d77303e3dbf222233ff4451d60974f12e244b'
          followup_path = Path(os.environ['RUNNER_TEMP']) / 'android-followup.patch'
          followup_path.write_bytes(followup)
          subprocess.run(['git','apply','--check',str(followup_path)],check=True)
          subprocess.run(['git','apply',str(followup_path)],check=True)
      - name: Install exact service dependency versions
        run: |
          python3 -m venv "$RUNNER_TEMP/license-venv"
          echo "$RUNNER_TEMP/license-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/license-venv/bin/pip" install -r services/licensing/requirements-test.txt PyYAML==6.0.2 pip-audit==2.10.1
      - name: Service adversarial tests and source regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s services/licensing/tests -v 2>&1 | tee "$RUNNER_TEMP/license-tests.log"
          python -m unittest discover -s scripts/tests -v 2>&1 | tee "$RUNNER_TEMP/source-tests.log"
          python scripts/check_build_contract.py
      - name: Audit production dependency graph
        run: pip-audit -r services/licensing/requirements.txt --format json --output "$RUNNER_TEMP/license-audit.json"
      - name: Restore unchanged Rust API bridge from verified source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          run-id: 36201561934
          github-token: ${{ github.token }}
          path: ./
      - name: Install project Flutter version
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Flutter analysis and complete existing test suite
        run: |
          set -euo pipefail
          cd flutter
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/flutter-analysis.log"
          flutter test 2>&1 | tee "$RUNNER_TEMP/flutter-tests.log"
      - name: Compile device-key channel against real Android and Flutter APIs
        run: |
          set -euo pipefail
          flutter precache --android
          engine_jar=$(find "$FLUTTER_ROOT/bin/cache/artifacts/engine" -name flutter.jar | head -n 1)
          android_jar=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)
          test -n "$engine_jar"
          test -n "$android_jar"
          kotlinc flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/ServiceLicenseChannel.kt -classpath "$engine_jar:$android_jar" -d "$RUNNER_TEMP/service-channel.jar" 2>&1 | tee "$RUNNER_TEMP/kotlin-compile.log"
      - name: Stage verified source without using runner workflow-edit privileges
        shell: python {0}
        run: |
          import json, os, subprocess
          from pathlib import Path
          run=lambda *a: subprocess.run(a, check=True)
          capture=lambda *a: subprocess.check_output(a,text=True).strip()
          run('git','checkout','HEAD','--','flutter/pubspec.lock')
          text=Path('flutter/pubspec.lock').read_text()
          import re
          text=re.sub(r'(  crypto:\n    dependency: )transitive',r'\1"direct main"',text)
          Path('flutter/pubspec.lock').write_text(text)
          run('git','diff','--check')
          workflow_paths=['.github/workflows/flutter-build.yml','.github/workflows/vynxdesk-managed-security.yml']
          staged={}
          for i, path in enumerate(workflow_paths):
              staged[path]={'sha':capture('git','hash-object','-w',path),'transfer':f'.github/maintenance/verified-workflow-{i}.txt'}
              Path(staged[path]['transfer']).write_bytes(Path(path).read_bytes())
          run('git','checkout','HEAD','--','.github/workflows/flutter-build.yml')
          Path('.github/workflows/vynxdesk-managed-security.yml').unlink()
          run('git','add','-A')
          run('git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat: add verified Android security and managed licensing source')
          run('git','push','origin','HEAD:refs/heads/codex/vynxdesk-android-licensing-20260926')
          report={'commit':capture('git','rev-parse','HEAD'),'tree':capture('git','rev-parse','HEAD^{tree}'),'workflows':staged}
          print('VERIFIED_DELIVERY='+json.dumps(report))
          Path(os.environ['RUNNER_TEMP'],'delivery.json').write_text(json.dumps(report,indent=2))
      - name: Preserve all verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vynxdesk-android-licensing-evidence
          path: |
            ${{ runner.temp }}/license-tests.log
            ${{ runner.temp }}/source-tests.log
            ${{ runner.temp }}/license-audit.json
            ${{ runner.temp }}/flutter-analysis.log
            ${{ runner.temp }}/flutter-tests.log
            ${{ runner.temp }}/kotlin-compile.log
            ${{ runner.temp }}/delivery.json
          retention-days: 14
          if-no-files-found: warn
