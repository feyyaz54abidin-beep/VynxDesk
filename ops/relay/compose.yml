services:
  hbbs:
    image: ${VYNX_RELAY_IMAGE:?Set VYNX_RELAY_IMAGE in .env}
    command: hbbs -r ${VYNX_RELAY_HOST:?Set VYNX_RELAY_HOST in .env}:21117
    volumes:
      - ./data:/root
    restart: unless-stopped
    ports:
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
      - "21119:21119/tcp"

  hbbr:
    image: ${VYNX_RELAY_IMAGE:?Set VYNX_RELAY_IMAGE in .env}
    command: hbbr
    volumes:
      - ./data:/root
    restart: unless-stopped
    ports:
      - "21117:21117/tcp"
